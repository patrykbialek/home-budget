<app-main-component>

  <div class="c-section-header">
    <div class="o-wrapper">
      <header class="c-section-header__title">
        <h4>{{ 'PLAN.Title' | translate }}</h4>
        <div class="u-margin-left u-border-left u-text-large">&nbsp;</div>
        <div>
          @for (link of navLinks; track link.index) {
            <button mat-button
              class="u-margin-left-tiny"
              [routerLink]="link.href"
              routerLinkActive="u-router-link-active"
            >{{ link.label }}</button>
          }
        </div>
        <div class="u-padding-right-small u-margin-right-small u-border-right u-text-large">&nbsp;</div>
        <hb-plan-breadcrumbs></hb-plan-breadcrumbs>
      </header>
    </div>
  </div>

  <div class="c-section-content u-padding-top-huge">
    <router-outlet></router-outlet>
  </div>

</app-main-component>
